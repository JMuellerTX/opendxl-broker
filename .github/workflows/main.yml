
name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron:  '0 0 * * *'

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 75
    # The client test suite is cloned from the master branch of the Java client fork, which is its JDK 21 line
    # (per-JDK branches jdk17/jdk11/jdk8 exist there, see its README.md "Branches"). Gradle runs on the matrix
    # JDK and the client's toolchain pins the same version, so no JDK is downloaded on the runner.
    strategy:
      matrix:
        java-version: [ 21 ]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Java ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ matrix.java-version }}

    - name: Build broker
      run: |
        docker build -t opendxlbroker:opendxlbroker .

    - name: Install broker
      run: |
        docker run -d -p 8883:8883 -p 8443:8443 -p 443:443 opendxlbroker:opendxlbroker
        docker ps -a

    - name: Provision client
      run: |
        git clone --recursive https://github.com/derjochenmueller/opendxl-client-java.git
        cd opendxl-client-java
        ./gradlew assemble --console=plain
        java -jar ./build/libs/dxlclient*all.jar provisionconfig clientconfig 127.0.0.1 client -u admin -p password
        sed -i -e "s/127.0.0.1;127.0.0.1/127.0.0.1/g" -e "/local/d" -e "/docker/d" clientconfig/dxlclient.config
        cat clientconfig/dxlclient.config
        
    - name: Execute CI
      run: |
        cd opendxl-client-java
        ./gradlew test --info --console=plain
        sed -i -e "s/^UseWebSockets *= *false/UseWebSockets = true/" -e "s/;8883/;443/g" -e "s/Brokers/BrokersWebSockets/g"  clientconfig/dxlclient.config
        cat clientconfig/dxlclient.config
        echo Running tests with WebSockets
        ./gradlew cleanTest test --info --console=plain
